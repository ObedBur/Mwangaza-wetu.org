services:
  # ─── Backend NestJS ───────────────────────────────────────────────────────────
  - type: web
    name: mwangaza-backend
    env: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install -g bun && bun install && bunx prisma generate && bun run build
    startCommand: bun run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # Mettre l'URL du frontend après déploiement

  # ─── Frontend Next.js ─────────────────────────────────────────────────────────
  - type: web
    name: mwangaza-frontend
    env: node
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install -g bun && bun install && bun run build
    startCommand: bun run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false # Mettre l'URL du backend après déploiement
